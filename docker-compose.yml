# A complete local stack: the database, and the two Redis instances.
#
# Two Redis servers rather than one, because Redis applies its eviction policy
# per instance. A cache set to evict under pressure would happily throw away
# queued work sharing the same server, and losing queued work loses data.
services:
  scylla:
    image: scylladb/scylla:6.2
    command: >
      --smp 1 --memory 1G --reserve-memory 256M
      --overprovisioned --developer-mode 1
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "nodetool status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis-cache:
    image: redis:7-alpine
    # Evicting here costs a database read. That is an acceptable trade.
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6379:6379"

  redis-queue:
    image: redis:7-alpine
    # Evicting here costs data. Losing a queue entry must be a counted decision
    # made by the stream cap, never a side effect of memory pressure.
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --save ""
    ports:
      - "6380:6379"
